# Local testing on the same Mac/PC; no Docker Desktop host networking required.
# docker compose -f compose.yaml -f compose.desktop.yaml up --build -d
services:
  api:
    environment:
      APP_ORIGIN: http://localhost
      COOKIE_SECURE: "false"
      LIVEKIT_URL: ws://localhost:7880

  caddy:
    environment:
      APP_ADDRESS: http://localhost
      LIVEKIT_ADDRESS: http://livekit.localhost
    ports: !override
      - "127.0.0.1:80:80"

  livekit:
    network_mode: !reset null
    networks:
      - app
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - 0.0.0.0
        log_level: info
        room:
          empty_timeout: 300
          departure_timeout: 30
        webhook:
          api_key: ${LIVEKIT_API_KEY:-devkey}
          urls:
            - http://api:8080/api/livekit/webhook
        rtc:
          tcp_port: 7881
          udp_port: 7882
          node_ip: 127.0.0.1
          use_external_ip: false
        turn:
          enabled: false
        keys:
          ${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secretsecretsecretsecretsecretsecret}
