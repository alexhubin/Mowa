name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Build and test the API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: mova
          POSTGRES_PASSWORD: mova
          POSTGRES_DB: mova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mova -d mova"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Without it the database and API integration tests silently skip.
      TEST_DATABASE_URL: postgres://mova:mova@localhost:5432/mova?sslmode=disable

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # -count=1 so a green run is never a cached one; -p 1 because the
      # integration tests share the one database.
      - name: Test
        run: go test -race -count=1 -p 1 ./cmd/... ./internal/...

  frontend:
    name: Lint, test and build the web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # tsc runs as part of the build, so this is the type check too.
      - run: npm run build

  queries:
    name: Generated queries are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The prebuilt image rather than building sqlc from source. Keep the tag
      # equal to the one in the Makefile or the two generate different code.
      - name: sqlc diff
        run: docker run --rm -v "$PWD:/src" -w /src sqlc/sqlc:1.29.0 diff

  caddy:
    name: Validate the Caddy site file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # This fragment is imported into the VPS's shared config, where a syntax
      # error blocks the reload for every project on the box. The deploy
      # re-validates the whole assembled config before it reloads anything.
      - name: Validate
        run: |
          docker run --rm -v "$PWD/deploy/caddy.caddy:/site.caddy:ro" \
            caddy:2.11.4-alpine caddy validate --config /site.caddy --adapter caddyfile

  images:
    name: Build and push the ${{ matrix.component }} image
    # Deliberately not gated on the check jobs: it runs beside them and only the
    # deploy waits for the whole gate. A failed run may leave an image tagged
    # with its SHA in the registry, which is never deployed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: api
            context: .
            dockerfile: Dockerfile
          - component: web
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The SHA tag is what makes a rollback a tag change, not a rebuild.
      - name: Resolve tags
        id: meta
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$repo-${{ matrix.component }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/$repo-${{ matrix.component }}:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    name: Deploy to VPS
    needs: [backend, frontend, queries, caddy, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # Separate from the CI-wide group so a new push cannot cancel a deploy that
    # is already replacing containers.
    concurrency:
      group: deploy-mova-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://mowa.hubindev.cc
    steps:
      - uses: actions/checkout@v7

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # Pinned rather than ssh-keyscan'd, which would trust whatever answers.
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Both images carry this run's commit, so the pair on the box is always
      # one build of one commit.
      - name: Resolve image tags
        id: meta
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "api=ghcr.io/$repo-api:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/$repo-web:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Sync the compose file
        run: |
          scp -i ~/.ssh/deploy compose.vps.yaml \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/mova/compose.vps.yaml"

      - name: Pull and restart
        run: |
          ssh -i ~/.ssh/deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            API_IMAGE='${{ steps.meta.outputs.api }}' \
            WEB_IMAGE='${{ steps.meta.outputs.web }}' \
            GHCR_USER='${{ github.actor }}' \
            GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
            'bash -euo pipefail -s' <<'REMOTE'
          cd /opt/mova

          # The run's own token, dropped on the way out: no long-lived registry
          # password lives on the box.
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          # So a reboot brings back this build, not whatever `latest` is by then.
          pin() {
            if grep -q "^$1=" .env; then
              sed -i "s|^$1=.*|$1=$2|" .env
            else
              printf '%s=%s\n' "$1" "$2" >> .env
            fi
          }
          pin API_IMAGE "$API_IMAGE"
          pin WEB_IMAGE "$WEB_IMAGE"

          docker compose -f compose.vps.yaml pull api web
          # Unchanged services are preserved. Changes to the LiveKit image or
          # configuration recreate it and interrupt active calls.
          docker compose -f compose.vps.yaml up -d --remove-orphans
          REMOTE

      - name: Sync the Caddy site
        run: |
          scp -i ~/.ssh/deploy deploy/caddy.caddy \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/gateway/staging/mova.caddy.upload"
          ssh -i ~/.ssh/deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'bash -euo pipefail -s' <<'REMOTE'
          incoming=/opt/gateway/staging/mova.caddy.upload
          trap 'rm -f "$incoming"' EXIT
          /opt/gateway/deploy-site.sh \
            mova "$incoming" https://mowa.hubindev.cc/api/health
          REMOTE

      # Over the internal network, so this reflects the containers themselves
      # and not Caddy or DNS.
      - name: Verify the containers are healthy
        run: |
          ssh -i ~/.ssh/deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'bash -euo pipefail -s' <<'REMOTE'
          check() {
            for i in $(seq 1 20); do
              if docker run --rm --network proxy curlimages/curl:8.11.1 \
                   -fsS -o /dev/null --max-time 5 "$1"; then
                echo "$1 healthy after ${i}s"; return 0
              fi
              sleep 1
            done
            echo "::error::$1 did not become healthy"
            docker compose -f /opt/mova/compose.vps.yaml logs --tail 50 api web
            return 1
          }
          check http://mova-api:8080/api/health
          check http://mova-web:8080/
          REMOTE

      # Retried: Caddy's active health check runs every 10s, so it still counts
      # the API as down for a moment after the container is replaced. Current
      # neighbours are checked too — the Caddy reload above is shared with them.
      - name: Verify every site is reachable through Caddy
        run: |
          check() {
            for i in $(seq 1 15); do
              if curl -fsS -o /dev/null --max-time 10 "$1"; then
                echo "$1 ok after $i attempt(s)"; return 0
              fi
              sleep 3
            done
            echo "::error::$1 is not reachable through Caddy"
            return 1
          }
          check https://mowa.hubindev.cc/api/health
          check https://mowa.hubindev.cc/
          check https://livekit.hubindev.cc/
          check https://monitor.hubindev.cc/api/health
          check https://pinyio-api.getinkzi.com/readyz
          check https://getinkzi.com/api/health
